version: '3.8'

services:
  veloura-backend:
    build: .
    container_name: veloura-backend
    restart: always
    ports:
      - "5000:7860"
    environment:
      - PORT=7860
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
